<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="canonical" href="https://notebooklm.google.com/">
  <title>Sample Notebook - NotebookLM</title>
</head>
<body>
  <chat-panel>
    <chat-message class="individual-message">
      <div class="from-user-container">
        <mat-card>
          <mat-card-content>
            <div class="message-text-content">
              <p>What is this notebook about?</p>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </chat-message>
    <chat-message class="individual-message">
      <div class="to-user-container">
        <mat-card>
          <mat-card-content>
            <div class="message-text-content">
              <p>This notebook is about machine learning fundamentals.</p>
            </div>
          </mat-card-content>
          <mat-card-actions class="message-actions">
            <button title="Pin this message to a Note" aria-label="Save message to a note">Pin</button>
          </mat-card-actions>
        </mat-card>
      </div>
    </chat-message>
    <chat-message class="individual-message">
      <div class="from-user-container">
        <mat-card>
          <mat-card-content>
            <div class="message-text-content">
              <p>Can you summarize the key points?</p>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </chat-message>
    <chat-message class="individual-message">
      <div class="to-user-container">
        <mat-card>
          <mat-card-content>
            <div class="message-text-content">
              <p>The key points include supervised learning, neural networks, and model evaluation.</p>
            </div>
          </mat-card-content>
          <mat-card-actions class="message-actions">
            <button title="Pin this message to a Note" aria-label="Save message to a note">Pin</button>
          </mat-card-actions>
        </mat-card>
      </div>
    </chat-message>
  </chat-panel>
</body>
</html>
